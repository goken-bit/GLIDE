<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLIDE — GLang IDE</title>
<link rel="stylesheet" href="vendor/codemirror.min.css">
<link rel="stylesheet" href="vendor/theme/monokai.min.css">
<style>
  :root {
    --bg: #0f1115;
    --panel: #16181d;
    --editor: #17181c;
    --border: #26292f;
    --fg: #d6d8de;
    --muted: #757a84;
    --accent: #52d273;
    --accent-dim: #1d3325;
    --warn: #e6b45a;
    --danger: #e0625f;
    --radius: 8px;
    --mono: "JetBrains Mono", "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }

  /* ---------- toolbar ---------- */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
  .brand b { font-size: 15px; letter-spacing: 0.4px; }
  .brand b em { font-style: normal; color: var(--accent); }
  .brand span { color: var(--muted); font-size: 11px; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--muted); font-weight: 600;
  }
  .field input {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; font-family: var(--mono);
    outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }
  #repo { width: 185px; }
  #pat { width: 120px; }
  .patwrap { position: relative; display: inline-flex; }
  .patwrap button {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 2px 4px;
  }
  .patwrap button:hover { color: var(--fg); }
  #pat { padding-right: 26px; }
  .actions { display: flex; gap: 8px; }
  button {
    border: 0; border-radius: 6px; cursor: pointer;
    font: 600 12px/1 inherit; padding: 7px 14px;
    background: #262a31; color: var(--fg);
    transition: background .15s, transform .05s;
  }
  button:hover { background: #31363f; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #buildBtn { background: var(--accent); color: #0a0f0b; }
  #buildBtn:hover { background: #5fe084; }

  /* ---------- editor ---------- */
  #editorwrap { flex: 1; min-height: 0; position: relative; }
  #editor { position: absolute; inset: 0; }
  #editor .CodeMirror {
    height: 100%; background: var(--editor);
    font: 13px/1.6 var(--mono);
  }
  #editor .CodeMirror-gutters {
    background: var(--editor); border-right: 1px solid var(--border);
  }
  #editor .CodeMirror-linenumber { color: #3c414b; }
  #editor .CodeMirror-cursor { border-left: 2px solid var(--accent); }
  #editorfallback {
    position: absolute; inset: 0; display: none;
    background: var(--editor); color: var(--fg); border: 0; padding: 16px;
    font: 13px/1.6 var(--mono); resize: none; outline: none; z-index: 2;
  }
  #editorfallback::placeholder { color: var(--muted); }
  #hint {
    position: absolute; right: 14px; bottom: 10px;
    font-size: 11px; color: var(--muted); background: rgba(15,17,21,.85);
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    pointer-events: none;
  }

  /* ---------- output panel ---------- */
  #output {
    height: 170px; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #output .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #dot.busy { background: var(--warn); animation: pulse 1s infinite; }
  #dot.ok { background: var(--accent); }
  #dot.err { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }
  #status { color: var(--fg); font-weight: 500; }
  #output .bar .spacer { flex: 1; }
  #clearBtn {
    border: 0; background: none; color: var(--muted); cursor: pointer;
    font-size: 11px; padding: 2px 6px; border-radius: 4px;
  }
  #clearBtn:hover { color: var(--fg); background: var(--bg); }
  #dl {
    color: var(--accent); text-decoration: none;
    border: 1px solid var(--accent-dim); border-radius: 6px;
    padding: 3px 10px; font-size: 11px;
  }
  #dl:hover { background: var(--accent-dim); }
  #logs {
    flex: 1; overflow: auto; padding: 8px 16px;
    font: 12px/1.7 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  #logs .err { color: var(--danger); }
  #logs .ok { color: var(--accent); }
  #logs .dim { color: var(--muted); }
  #logs .sep { color: var(--border); border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  #empty { color: var(--muted); font-style: italic; }

  @media (max-width: 760px) {
    header { gap: 8px; padding: 10px 12px; }
    .brand span { display: none; }
    #repo { width: 100%; } #pat { width: 120px; }
    .field { flex: 1 1 100%; }
    .actions { flex: 1 1 100%; justify-content: flex-end; }
    #output { height: 200px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><b>GL<em>IDE</em></b><span>GLang playground</span></div>
  <div class="field">
    <label for="repo">Repository</label>
    <input id="repo" placeholder="owner/repo" spellcheck="false" autocomplete="off">
  </div>
  <div class="field">
    <label for="pat">Token</label>
    <span class="patwrap">
      <input id="pat" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false">
      <button id="patToggle" type="button" title="Show / hide token">👁</button>
    </span>
  </div>
  <div class="actions">
    <button id="newBtn" title="Blank file">New</button>
    <button id="saveBtn" title="Download main.g">Save</button>
    <button id="buildBtn" title="Compile on GitHub Actions (Ctrl+Enter)">Build</button>
  </div>
</header>

<div id="editorwrap">
  <div id="editor"><textarea id="src"></textarea></div>
  <textarea id="editorfallback" placeholder="…"></textarea>
  <div id="hint">Ctrl+Enter to build</div>
</div>

<div id="output">
  <div class="bar">
    <span id="dot"></span>
    <span id="status">Ready</span>
    <span class="spacer"></span>
    <a id="dl" href="#" hidden>Download binary</a>
    <button id="clearBtn" type="button">Clear</button>
  </div>
  <div id="logs"></div>
</div>

<script src="vendor/codemirror.min.js"></script>
<script>
// ---------- GLang CodeMirror mode ----------
(function () {
  const KW = "fn let mut const if elif else while for in return break continue struct loop step true false and or not import as match default pub int float bool string void char impl self virtual";
  const B = "window running dt width height frame_begin frame_end clear fill rect rect_outline circle circle_filled line point text text_int key_down key_pressed mouse_x mouse_y mouse_down mouse_clicked distance random randomf abs min max clamp fclamp print println print_raw int_to_string float_to_string i2s f2s";
  const T = "int float bool string void char";
  CodeMirror.defineMode("glang", () => ({
    start: [
      { regex: /\/\/.*$/, token: "comment" },
      { regex: /\/\*[\s\S]*?\*\//, token: "comment" },
      { regex: /"(?:[^"\\]|\\.)*"/, token: "string" },
      { regex: /'(?:[^'\\]|\\.)?'/, token: "string" },
      { regex: /\b\d+(?:\.\d+)?\b/, token: "number" },
      { regex: /(?:struct|impl)\s+([A-Za-z_]\w*)/, token: ["keyword", "def"] },
      { regex: /\bfn\s+([A-Za-z_]\w*)/, token: ["keyword", "def"] },
      { regex: new RegExp("\\b(?:" + T.split(" ").join("|") + ")\\b"), token: "type" },
      { regex: new RegExp("\\b(?:" + KW.split(" ").join("|") + ")\\b"), token: "keyword" },
      { regex: new RegExp("\\b(?:" + B.split(" ").join("|") + ")\\b"), token: "builtin" },
      { regex: /[{}()[\],.]/, token: "bracket" },
      { regex: /[+\-*/%=<>!&|]+/, token: "operator" }
    ]
  }));
})();

// ---------- IDE ----------
const $ = id => document.getElementById(id);

let editor = null;
try {
  if ((navigator.maxTouchPoints || 0) > 0) throw new Error("touch");
  editor = CodeMirror.fromTextArea($("src"), {
    mode: "glang", theme: "monokai", lineNumbers: true,
    indentUnit: 4, tabSize: 4, lineWrapping: true
  });
} catch (e) {
  $("editor").style.display = "none";
  $("editorfallback").style.display = "block";
  $("hint").textContent = "Basic editor — highlighting off";
}
const getValue = () => editor ? editor.getValue() : $("editorfallback").value;
const setValue = v => (editor ? editor.setValue(v) : ($("editorfallback").value = v));

const EXAMPLE = `// Pong — complete 2D game in GLang
let screen_w = 800
let screen_h = 600

let px = 30.0
let py = 250.0
let paddle_h = 100.0
let paddle_w = 15.0

let cx = 760.0
let cy = 250.0
let bx = 400.0
let by = 300.0
let bvx = 300.0
let bvy = 200.0
let ball_r = 10.0

fn reset_ball() {
    bx = 400.0
    by = 300.0
    bvx = -bvx
}

fn game_update(dt: float) {
    if key_down(26) { py = py - 400.0 * dt }
    if key_down(22) { py = py + 400.0 * dt }

    if cy + paddle_h / 2.0 < by { cy = cy + 200.0 * dt }
    if cy + paddle_h / 2.0 > by { cy = cy - 200.0 * dt }
    if cy < 0.0 { cy = 0.0 }
    if cy > 500.0 { cy = 500.0 }

    bx = bx + bvx * dt
    by = by + bvy * dt

    if by < ball_r                { by = ball_r;          bvy = -bvy }
    if by > screen_h - ball_r     { by = screen_h - ball_r; bvy = -bvy }

    if bx - ball_r < px + paddle_w and bx + ball_r > px and by > py and by < py + paddle_h {
        bx = px + paddle_w + ball_r
        bvx = -bvx + 20.0
    }
    if bx + ball_r > cx and bx - ball_r < cx + paddle_w and by > cy and by < cy + paddle_h {
        bx = cx - ball_r
        bvx = -bvx
    }
}

fn main() {
    window(screen_w, screen_h, "Pong — GLang")
    while running() {
        frame_begin()
        game_update(dt())
        clear(20, 20, 40)
        fill(255, 80, 80, 255)
        rect(px, py, paddle_w, paddle_h)
        rect(cx, cy, paddle_w, paddle_h)
        circle_filled(bx, by, ball_r)
        frame_end()
    }
}`;

let emptyShown = true;
function log(text, cls) {
  const l = $("logs");
  if (emptyShown) {
    const empty = $("empty");
    if (empty) empty.remove();
    emptyShown = false;
  }
  if (text === null) return;
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = text;
  l.appendChild(div);
  l.scrollTop = l.scrollHeight;
}
function status(text, dot) {
  $("status").textContent = text;
  $("dot").className = dot || "";
}

function showEmpty() {
  $("logs").innerHTML = "";
  const empty = document.createElement("div");
  empty.id = "empty";
  empty.textContent = "Build output appears here — hit Build (or Ctrl+Enter).";
  $("logs").appendChild(empty);
  emptyShown = true;
}

// empty-state hint
showEmpty();

// persistence
["repo", "pat"].forEach(k => {
  const el = $(k);
  el.value = localStorage.getItem("glide2:" + k) || "";
  el.addEventListener("change", () => localStorage.setItem("glide2:" + k, el.value.trim()));
});
$("patToggle").addEventListener("click", () => {
  const p = $("pat");
  p.type = p.type === "password" ? "text" : "password";
});

$("newBtn").addEventListener("click", () => { setValue(""); (editor || $("editorfallback")).focus(); });
$("saveBtn").addEventListener("click", () => {
  const blob = new Blob([getValue()], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "main.g";
  a.click();
  URL.revokeObjectURL(a.href);
});
$("clearBtn").addEventListener("click", showEmpty);

async function apiContents(repo, token, path) {
  const r = await fetch("https://api.github.com/repos/" + repo + "/contents/" + path + "?ref=glide-results", {
    headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json" }
  });
  if (!r.ok) throw new Error("api " + r.status);
  const j = await r.json();
  return j.encoding === "base64"
    ? Uint8Array.from(atob(j.content), c => c.charCodeAt(0))
    : j.content;
}

async function fetchResult(repo, token, id) {
  const url = "https://raw.githubusercontent.com/" + repo + "/glide-results/" + id + "/result.txt";
  try {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) throw new Error();
    const t = await r.text();
    if (!/404: Not Found/.test(t)) return t;
  } catch (e) { /* fall through */ }
  const c = await apiContents(repo, token, "results/" + id + "/result.txt");
  return c instanceof Uint8Array ? new TextDecoder().decode(c) : c;
}

async function pollForBuild(repo, token, id, tries) {
  for (let i = 0; i < tries; i++) {
    await new Promise(res => setTimeout(res, 2500));
    try {
      const t = await fetchResult(repo, token, id);
      if (t !== null) return t;
    } catch (e) { /* not ready yet */ }
  }
  return null;
}

function downloadBinary(repo, token, id) {
  const rawUrl = "https://raw.githubusercontent.com/" + repo + "/glide-results/" + id + "/main";
  fetch(rawUrl, { method: "HEAD" })
    .then(r => {
      if (r.ok) return r.ok ? rawUrl + "?download=" + id + ".bin" : null;
      throw new Error();
    })
    .catch(() => apiContents(repo, token, "results/" + id + "/main"))
    .then(bin => {
      if (typeof bin === "string") { window.open(bin, "_blank"); return; }
      const blob = new Blob([bin], { type: "application/octet-stream" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = id + ".bin";
      a.click();
      URL.revokeObjectURL(a.href);
    })
    .catch(e => log("Binary download failed: " + e, "err"));
}

async function build() {
  const repo = $("repo").value.trim();
  const token = $("pat").value.trim();
  const src = getValue();
  if (!repo) return log("Set your repository (owner/name) and token first.", "err");
  if (!token) return log("Paste a token with repo scope (kept only in this browser).", "err");
  if (!src.trim()) return log("Nothing to build — the editor is empty.", "err");

  $("buildBtn").disabled = true;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  log("── Dispatch " + id + " → " + repo, "sep");
  log("Building…", "dim");
  status("Building " + id + "…", "busy");
  $("dl").hidden = true;

  try {
    const res = await fetch("https://api.github.com/repos/" + repo + "/dispatches", {
      method: "POST",
      headers: {
        "Authorization": "token " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ event_type: "glang-build", client_payload: { id, code: src } })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error("dispatch " + res.status + ": " + (e.message || "failed"));
    }
    const out = await pollForBuild(repo, token, id, 42);
    if (out === null) {
      status("Timed out", "err");
      return log("Timed out waiting for the result — check the Actions run.", "err");
    }
    const fail = /^(Error|Parse error|Codegen error|Compile error)/m.test(out);
    log(out, fail ? "err" : "ok");
    status("Build " + id + (fail ? " failed" : " succeeded"), fail ? "err" : "ok");
    if (!fail) {
      const dl = $("dl");
      dl.hidden = false;
      dl.onclick = ev => { ev.preventDefault(); downloadBinary(repo, token, id); };
    }
  } catch (e) {
    status("Build failed", "err");
    log(String(e.message || e), "err");
  } finally {
    $("buildBtn").disabled = false;
  }
}

$("buildBtn").addEventListener("click", build);
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { ev.preventDefault(); build(); }
});

if (!getValue()) setValue(EXAMPLE);
</script>
</body>
</html>
