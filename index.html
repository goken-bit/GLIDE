<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLIDE — GLang IDE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --border: #333;
    --fg: #d4d4d4;
    --accent: #4caf50;
    --error: #f0625f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  header h1 span { color: #4caf50; }
  header .spacer { flex: 1; }
  header label { font-size: 12px; color: #9e9e9e; }
  header input {
    background: #1e1e1e; color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; font-size: 12px; width: 240px;
  }
  button {
    background: var(--accent); color: #0a0a0a; border: 0; border-radius: 4px;
    padding: 7px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button#newBtn, button#runBtn, button#saveBtn {
    background: #3a3a3a; color: var(--fg);
  }
  #editorwrap { flex: 1; min-height: 0; position: relative; }
  #editor { height: 100%; }
  #editor .CodeMirror { height: 100%; font: 13px/1.5 "JetBrains Mono", Consolas, monospace; }
  #output {
    height: 148px; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #output .bar {
    display: flex; gap: 10px; align-items: center; padding: 5px 14px;
    font-size: 12px; color: #9e9e9e;
  }
  #output .bar .spacer { flex: 1; }
  #output .bar a { color: #81d4fa; }
  #logs {
    flex: 1; overflow: auto; padding: 6px 14px;
    font: 12px/1.5 "JetBrains Mono", Consolas, monospace; white-space: pre-wrap;
  }
  #logs .err { color: var(--error); }
  #logs .ok { color: var(--accent); }
  #logs .dim { color: #9e9e9e; }
</style>
</head>
<body>
<header>
  <h1>GL<span>IDE</span></h1>
  <button id="newBtn" title="Start a blank file">New</button>
  <button id="saveBtn" title="Save as a local file">Save</button>
  <div class="spacer"></div>
  <button id="runBtn" title="Build on GitHub Actions">Build</button>
  <label>repo</label>
  <input id="repo" placeholder="owner/repo">
  <label>PAT</label>
  <input id="pat" type="password" placeholder="ghp_…" autocomplete="off">
</header>
<div id="editorwrap"><textarea id="editor"></textarea></div>
<div id="output">
  <div class="bar">
    <span id="status">Ready</span>
    <span class="spacer"></span>
    <a id="dl" hidden href="#">Download binary</a>
  </div>
  <div id="logs"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script>
// ---------- GLang syntax definition ----------
const GLANG = {
  keywords: "fn let mut const if elif else while for in return break continue struct loop step true false and or not import as match default pub int float bool string void char impl self virtual",
  builtins: "window running dt width height frame_begin frame_end clear fill rect rect_outline circle circle_filled line point text text_int key_down key_pressed mouse_x mouse_y mouse_down mouse_clicked distance random randomf abs min max clamp fclamp print println print_raw int_to_string float_to_string i2s f2s",
  types: "int float bool string void char"
};

// ---------- GLang mode for CodeMirror ----------
(function () {
  const K = GLANG.keywords, B = GLANG.builtins, T = GLANG.types;
  const m = {
    start: [
      { regex: /\/\/.*$/, token: "comment" },
      { regex: /\/\*[\s\S]*?\*\//, token: "comment" },
      { regex: /"(?:[^"\\]|\\.)*"/, token: "string" },
      { regex: /'(?:[^'\\]|\\.)?'/, token: "string" },
      { regex: /\b\d+(?:\.\d+)?(?:f|F)?\b/, token: "number" },
      { regex: new RegExp("\\b(?:" + T + ")\\b"), token: "type" },
      { regex: new RegExp("\\b(?:" + K + ")\\b"), token: "keyword" },
      { regex: new RegExp("\\b(?:" + B + ")\\b"), token: "builtin" },
      { regex: /\b[A-Za-z_]\w*(?=\s*\()/, token: "def" },
      { regex: /[{}()[\]]/, token: "bracket" },
      { regex: /[+\-*/%=<>!&|]+/, token: "operator" }
    ]
  };
  if (typeof CodeMirror !== "undefined") CodeMirror.defineMode("glang", () => m);
})();

// ---------- IDE ----------
const $ = id => document.getElementById(id);
const editor = CodeMirror.fromTextArea($("editor"), {
  mode: "glang", theme: "monokai", lineNumbers: true,
  indentUnit: 4, tabSize: 4, autoCloseBrackets: false
});

const EXAMPLE = `// Pong — complete 2D game in GLang
let screen_w = 800
let screen_h = 600

let px = 30.0
let py = 250.0
let paddle_h = 100.0
let paddle_w = 15.0

let cx = 760.0
let cy = 250.0
let bx = 400.0
let by = 300.0
let bvx = 300.0
let bvy = 200.0
let ball_r = 10.0

fn reset_ball() {
    bx = 400.0
    by = 300.0
    bvx = -bvx
}

fn game_update(dt: float) {
    if key_down(26) { py = py - 400.0 * dt }
    if key_down(22) { py = py + 400.0 * dt }

    if cy + paddle_h / 2.0 < by { cy = cy + 200.0 * dt }
    if cy + paddle_h / 2.0 > by { cy = cy - 200.0 * dt }
    if cy < 0.0 { cy = 0.0 }
    if cy > 500.0 { cy = 500.0 }

    bx = bx + bvx * dt
    by = by + bvy * dt

    if by < ball_r      { by = ball_r;  bvy = -bvy }
    if by > screen_h - ball_r { by = screen_h - ball_r; bvy = -bvy }

    if bx - ball_r < px + paddle_w and bx + ball_r > px and by > py and by < py + paddle_h {
        bx = px + paddle_w + ball_r
        bvx = -bvx + 20.0
    }
    if bx + ball_r > cx and bx - ball_r < cx + paddle_w and by > cy and by < cy + paddle_h {
        bx = cx - ball_r
        bvx = -bvx
    }
}

fn main() {
    window(screen_w, screen_h, "Pong — GLang")
    while running() {
        frame_begin()
        game_update(dt())
        clear(20, 20, 40)
        fill(255, 80, 80, 255)
        rect(px, py, paddle_w, paddle_h)
        rect(cx, cy, paddle_w, paddle_h)
        circle_filled(bx, by, ball_r)
        frame_end()
    }
}`;

function log(text, cls) {
  const l = $("logs");
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = text;
  l.appendChild(div);
  l.scrollTop = l.scrollHeight;
}
function status(text) { $("status").textContent = text; }

("repo", "pat").forEach(k => {
  const el = $(k);
  el.value = localStorage.getItem("glide:" + k) || "";
  el.addEventListener("change", () => localStorage.setItem("glide:" + k, el.value.trim()));
});
if (!editor.getValue()) editor.setValue(EXAMPLE);
$("status").textContent = "Type code, then hit Build.";

$("newBtn").addEventListener("click", () => {
  editor.setValue("");
  editor.focus();
});
$("saveBtn").addEventListener("click", () => {
  const blob = new Blob([editor.getValue()], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "main.g"; a.click();
  URL.revokeObjectURL(url);
});

async function apiContents(repo, token, path) {
  const r = await fetch("https://api.github.com/repos/" + repo + "/contents/" + path + "?ref=glide-results", {
    headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json" }
  });
  if (!r.ok) throw new Error("api " + r.status);
  const j = await r.json();
  return j.encoding === "base64"
    ? Uint8Array.from(atob(j.content), c => c.charCodeAt(0))
    : j.content;
}

async function fetchResult(repo, token, id) {
  const url = "https://raw.githubusercontent.com/" + repo + "/glide-results/" + id + "/result.txt";
  try {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) throw new Error();
    const t = await r.text();
    return /404: Not Found/.test(t) ? null : t;
  } catch (e) {
    const c = await apiContents(repo, token, "results/" + id + "/result.txt");
    return c instanceof Uint8Array ? new TextDecoder().decode(c) : c;
  }
}

async function pollForBuild(repo, token, id, tries) {
  for (let i = 0; i < tries; i++) {
    await new Promise(res => setTimeout(res, 2500));
    try {
      const t = await fetchResult(repo, token, id);
      if (t !== null) return t;
    } catch (e) { /* not ready yet */ }
  }
  return null;
}

$("runBtn").addEventListener("click", async () => {
  const repo = $("repo").value.trim();
  const token = $("pat").value.trim();
  const src = editor.getValue();
  if (!repo) return log("Set your repo (owner/name) and PAT first.", "err");
  if (!token) return log("Paste a PAT with repo scope (stored only in this browser).", "err");
  if (!src.trim()) return log("Nothing to build.", "err");

  $("runBtn").disabled = true;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  log("Dispatching build " + id + " to " + repo + " …");
  status("Building " + id + " …");

  try {
    const dispatch = await fetch("https://api.github.com/repos/" + repo + "/dispatches", {
      method: "POST",
      headers: {
        "Authorization": "token " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ event_type: "glang-build", client_payload: { id, code: src } })
    });
    if (!dispatch.ok) {
      const e = await dispatch.json();
      throw new Error("dispatch " + dispatch.status + ": " + (e.message || "failed"));
    }
    log("Dispatched. Waiting for the workflow result (≤ ~90 s) …", "dim");
    const res = await pollForBuild(repo, token, id, 42);
    if (res === null) { status("Timed out"); log("Timed out waiting for result.txt — check the Actions run.", "err"); return; }
    log(res, /^Error|error:|Parse error|Codegen error|Compile error/.test(res) ? "err" : "ok");
    status("Build " + id + " done");
    const dl = $("dl");
    dl.hidden = false;
    dl.textContent = "Download binary (" + id + ")";
    dl.onclick = async ev => {
      ev.preventDefault();
      const rawUrl = "https://raw.githubusercontent.com/" + repo + "/glide-results/" + id + "/main";
      try {
        const head = await fetch(rawUrl, { method: "HEAD" });
        if (head.ok) { location.href = rawUrl + "?download=" + id + ".bin"; return; }
      } catch (e) { /* fall through to API */ }
      try {
        const bin = await apiContents(repo, token, "results/" + id + "/main");
        const blob = new Blob([bin], { type: "application/octet-stream" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = id + ".bin";
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e2) { log("Binary download failed: " + e2, "err"); }
    };
  } catch (e) {
    status("Build failed");
    log(String(e.message || e), "err");
  } finally {
    $("runBtn").disabled = false;
  }
});
</script>
</body>
</html>
